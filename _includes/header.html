<header class="top">
  <div class="top-in">
    <button class="nav-toggle" type="button" aria-controls="sidebar" aria-expanded="false">Menu</button>
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/logo.png' | relative_url }}" alt="" width="28" height="28">
      goome <span>docs</span>
    </a>
    <div class="search" id="search">
      <div class="search-bar">
        <input class="search-input" id="search-input" type="search" placeholder="Search the docs" autocomplete="off" spellcheck="false" aria-label="Search the docs" aria-controls="search-hits" aria-expanded="false" aria-autocomplete="list" role="combobox" data-index="{{ '/search.json' | relative_url }}">
        <kbd class="search-key">Ctrl K</kbd>
        <button class="search-close" type="button">Close</button>
      </div>
      <div class="search-hits" id="search-hits" role="listbox" hidden></div>
    </div>
    <button class="search-open" type="button" aria-label="Search" aria-controls="search">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <nav class="top-links">
      <a href="https://github.com/goome-ui/c-goome">c-goome</a>
      <a href="https://github.com/goome-ui">GitHub</a>
    </nav>
  </div>
</header>
<div class="shade" hidden></div>
